name: Build iOS IPA

# Builds a signed App Store .ipa with fastforge and uploads it to App Store
# Connect (TestFlight). See docs/ios.md §"Continuous integration".
#
# Signing: the Runner target uses "Automatically manage signing" with the team
# set (DEVELOPMENT_TEAM in project.pbxproj). `flutter build ipa` never passes an
# App Store Connect API key to xcodebuild, so the build needs the real signing
# assets installed locally: an Apple Distribution certificate (.p12) and an
# App Store provisioning profile (.mobileprovision). The API key is used only by
# the fastforge `altool` upload.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAPBOX_DOWNLOADS_TOKEN            Mapbox secret token, scope Downloads:Read
#   DART_DEFINES_JSON_BASE64          base64 of .dart-define.json
#   IOS_CERTIFICATE_BASE64            base64 of the Apple Distribution .p12
#   IOS_CERTIFICATE_PASSWORD          password of that .p12 (optional)
#   IOS_PROVISION_PROFILE_BASE64      base64 of the App Store .mobileprovision
#   APP_STORE_CONNECT_KEY_ID          App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_BASE64  base64 of AuthKey_<key id>.p8

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    # macOS 26 (arm64) — the current GA image. See docs/ios.md for notes.
    runs-on: macos-26
    permissions:
      contents: write

    env:
      # fastforge's appstore publisher reads these and shells out to
      # `xcrun altool --upload-app`. The matching key file is written below.
      APPSTORE_APIKEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPSTORE_APIISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      # The Mapbox iOS SDK is pulled over Swift Package Manager and is gated
      # behind a token with the Downloads:Read scope, fetched via ~/.netrc.
      # Must run before the build so SPM can resolve the package.
      - name: Configure Mapbox downloads credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set"
            exit 1
          fi
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' \
            "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      # Xcode signs the archive with these local assets (no Apple ID account on
      # the runner, and `flutter build ipa` can't hand xcodebuild an API key).
      - name: Import distribution certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::IOS_CERTIFICATE_BASE64 / IOS_PROVISION_PROFILE_BASE64 are not set"
            exit 1
          fi

          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          # Ephemeral keychain that only exists for this run.
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          # The .p12 may be passwordless; only pass -P when a password is set.
          IMPORT_ARGS=(-A -t cert -f pkcs12 -k "$KEYCHAIN_PATH")
          if [ -n "$CERTIFICATE_PASSWORD" ]; then
            IMPORT_ARGS=(-P "$CERTIFICATE_PASSWORD" "${IMPORT_ARGS[@]}")
          fi
          security import certificate.p12 "${IMPORT_ARGS[@]}"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Install the profile under its UUID so xcodebuild finds it.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          security cms -D -i profile.mobileprovision > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          cp profile.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Code signing identities:"
          security find-identity -v -p codesigning
          echo "Installed profiles:"
          ls -1 "$PROFILE_DIR"

      # Only needed for the fastforge `altool` upload, not for the build.
      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$API_KEY_BASE64" ] || [ -z "$KEY_ID" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 / APP_STORE_CONNECT_KEY_ID are not set"
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Write dart-define config
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.DART_DEFINES_JSON_BASE64 }}
        run: |
          if [ -z "$DART_DEFINES_JSON_BASE64" ]; then
            echo "::error::DART_DEFINES_JSON_BASE64 secret is not set"
            exit 1
          fi
          echo "$DART_DEFINES_JSON_BASE64" | base64 --decode > .dart-define.json

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build and upload to App Store Connect
        run: fastforge release --name appstore

      - name: Upload IPA to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/**/*.ipa

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-symbols
          path: build/ios/symbols/**
          if-no-files-found: ignore

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ~/.netrc certificate.p12 profile.mobileprovision .dart-define.json
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
