include: package:flutter_lints/flutter.yaml

# Strict static analysis: AGENTS.md requires `flutter analyze --fatal-infos`
# to be clean, so anything the analyzer can infer unsafely is treated as a bug.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - .dart_tool/**
    - web/**
    # Generated bindings (ObjectBox, drift) are produced by build_runner and
    # are not held to the project's lints.
    - "**/*.g.dart"
    - "**/*.drift.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
