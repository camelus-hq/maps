# Local development services.
#
# Passwords are **not** committed. Copy `.env.example` to `.env` (gitignored)
# and fill in the same values as `config/passwords.yaml`, or export them in the
# environment. Docker Compose loads `.env` automatically.
#
# Note: `serverpod start` and `dart test` use Serverpod's embedded PostgreSQL
# (see `config/*.yaml` `dataPath`) and do not need this file.
services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: maps_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - maps_api_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: maps_api_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?set POSTGRES_TEST_PASSWORD in .env}
    volumes:
      - maps_api_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "${REDIS_TEST_PASSWORD:?set REDIS_TEST_PASSWORD in .env}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  maps_api_data:
  maps_api_test_data:
