name: maps_api_server
description: OpenMaps push backend — a Nostr gift-wrap forwarder over FCM / UnifiedPush.

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.1.2
  serverpod_auth_idp_server: 4.1.2
  serverpod_cloud_storage: 4.1.2
  # Nostr: BIP-340 signature verification for push registrations and NIP-59
  # gift-wrap encryption for events the server has to wrap before forwarding.
  # (The same library the Flutter app uses, so the wire format matches exactly.)
  ndk: ^0.10.1
  # Minimal Google surface for sending FCM HTTP v1 messages: OAuth2 service
  # account tokens only. Deliberately *not* the Firebase Admin SDK — push needs
  # messaging and nothing else, and no Google library is used by the app.
  googleapis_auth: ^2.3.0
  http: ^1.6.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.1.2
  test: ^1.25.5
