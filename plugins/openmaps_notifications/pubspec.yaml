name: openmaps_notifications
description: "OpenMaps' local-notification channel, registered on the main and the FCM background Flutter engine."
version: 0.1.0
publish_to: 'none'
repository: https://github.com/camelus-hq/maps

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.camelus.maps.openmaps_notifications
        pluginClass: OpenmapsNotificationsPlugin
      ios:
        pluginClass: OpenmapsNotificationsPlugin
