name: openmaps
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_device_compass: ^2.2.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.1
  mapbox_maps_flutter: ^3.0.0
  mobile_scanner: 7.4.2
  phosphor_icons: ^3.0.1
  # QR *encoding* for the "My code" screen. Note: qr ^4.0.0 cannot be used —
  # ndk_flutter (>=0.8.4) → pretty_qr_code 3.6.0 calls the qr 3 API
  # (`QrErrorCorrectLevel.M`, `QrCode.fromData`), which qr 4 removed, so
  # forcing qr 4 fails to compile. 3.0.2 is the newest compatible release.
  qr: ^3.0.2
  ndk: ^0.10.1
  ndk_flutter: ^0.10.1
  # SHA-256 verification of a downloaded update APK.
  crypto: ^3.0.7
  # The app's cache directory, where an update APK is downloaded before install.
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
